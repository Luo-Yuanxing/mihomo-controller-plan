appId: com.mihomo.controller.panel
productName: 代理控制面板
# 产物统一带版本号：zip 名与主程序 exe 名都能直接看出是哪个版本，多版本可并存
artifactName: '${productName}-${version}-${arch}.${ext}'
# executableName 不做宏替换，exe 的版本号后缀由 scripts/after-pack.cjs 补上
afterPack: scripts/after-pack.cjs
asar: true
# better-sqlite3 是原生模块，必须解包到 app.asar.unpacked
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - ui/dist/**
  - electron/**
  - package.json

extraResources:
  - from: resources/bin
    to: bin
  - from: resources/geo
    to: geo
  - from: resources/tray.png
    to: tray.png

# 只拷贝 data 骨架，避免把开发机的真实运行数据打进发布包
extraFiles:
  - from: resources/data-skeleton
    to: data

win:
  target:
    - target: dir
      arch:
        - x64
    - target: zip
      arch:
        - x64
